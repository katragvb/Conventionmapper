version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Roslyn and Microsoft.Extensions versions are pinned on purpose: newer versions would raise the minimum SDK / runtime for users.
      - dependency-name: Microsoft.CodeAnalysis*
      - dependency-name: Microsoft.Extensions.*
      - dependency-name: Microsoft.EntityFrameworkCore*
      # Analyzers and generators must use the compiler's own copies of these; newer versions stop them loading on older SDKs.
      - dependency-name: System.Collections.Immutable
      - dependency-name: System.Reflection.Metadata
